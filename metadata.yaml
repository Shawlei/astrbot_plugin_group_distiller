# 插件唯一识别名，以 astrbot_plugin_ 前缀开头
name: astrbot_plugin_group_distiller
# 展示名（需要 AstrBot >= v4.5.0，低版本不会报错）
display_name: 我要蒸馏群友
desc: 静默采集多个「指定群 + 指定群友」的聊天语料，用 LLM 蒸馏成 5 层 AI 人格档案；群内 /zl 查进度与目标清单，可设定每天定时用当天全部对话自动总结，并把蒸馏结果一键写进 AstrBot 的人格设定。
short_desc: 把群友蒸馏成人格档案：多目标 + 每日定时总结 + /zl 进度 + 一键写入 AstrBot 人格
# 插件版本号，格式：v1.1.1 或 v1.1
version: v0.4.0
author: Shawlei
repo: https://github.com/Shawlei/astrbot_plugin_group_distiller

# 声明支持平台：本插件依赖 QQ 群消息与群号/QQ 号语义
support_platforms:
  - aiocqhttp

# 声明 AstrBot 版本范围（PEP 440，不加 v 前缀）。
# 下限取 4.10.4：可视化「蒸馏目标清单」用到 template_list 类型（该版本引入）。
# _special 模型选择器从 4.0.0 起可用。若你的 AstrBot 更老，
# 可删掉 _conf_schema.json 里的 targets 字段，改用 targets_text 纯文本清单。
astrbot_version: ">=4.10.4,<5"
